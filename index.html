<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NOVA</title>
    <meta name="description" content="NOVA: مساعدك الذكي في كل حاجة — اسأل أي سؤال بالكتابة أو بصوتك، اختبر نفسك في أي موضوع، وخطط مذاكرتك." />
    <meta name="theme-color" content="#f5f8fc" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="stylesheet" href="./fonts/cairo.css" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NOVA" />
    <script>
      window.__bootErr = '';
      window.addEventListener('error', function (e) { window.__bootErr = String(e.message || 'error'); });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          var d = document.createElement('div');
          d.style.cssText = 'padding:60px 24px;text-align:center;font-family:sans-serif;direction:rtl;color:#1d2b27';
          d.innerHTML = '<h2 style="color:#2878e8">NOVA</h2><p>المتصفح ده قديم على التطبيق. جرّب تفتح اللينك من متصفح كروم محدّث أو سامسونج انترنت.</p><p style="color:#98a8a1;font-size:11px;direction:ltr;word-break:break-all">' + window.__bootErr + '</p>';
          document.body.appendChild(d);
        }
      }, 6000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
